[project]
name = "expense-agent"
version = "2.0.0"
description = "expense-reimbursement v2 opinion sidecar — LangGraph 生成图（draft→validate⇄repair→fallback）"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4,<0.6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openai>=1.40",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error",
    # langgraph 0.5.x 导入期噪音（试点仓同款，文案锚死；禁全局放宽）
    "ignore:The default value of `allowed_objects` will change:langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
]
