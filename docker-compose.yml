# 财务报销系统四服务编排（v2：db + agent + backend + frontend）。
#
# agent 是 Python sidecar（LangGraph 意见生成图，OpenAI 兼容 LLM），
# backend 经 http://agent:8100 调它；LLM_MODE 必填 mock|live。
#
# 用法：
#   docker compose up -d           # 后台启动
#   docker compose logs -f backend # 看后端日志
#   docker compose down            # 停（保留 volume）
#   docker compose down -v         # 停 + 删 postgres 数据卷（注意 CLAUDE.md
#                                  # 已警告这是"危险操作"）

services:
  db:
    image: postgres:16-alpine
    container_name: expense-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-expense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expense}
      POSTGRES_DB: ${POSTGRES_DB:-expense}
    ports:
      # 暴露给宿主用于本地开发连接；生产部署可关掉
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-expense} -d ${POSTGRES_DB:-expense}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  agent:
    build: ./agent
    container_name: expense-agent
    restart: unless-stopped
    environment:
      # LLM_MODE 必填（:?）——mock|live，禁 env 默认值兜底（suite 铁律）；
      # live 缺 key 由 Python 侧 fail-fast 拦，mock 模式无 key 也得起容器
      LLM_MODE: "${LLM_MODE:?LLM_MODE 必填 mock|live}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      AGENT_PORT: "8100"
    ports:
      # dev 便捷映射；prod（deploy 脚本）不暴 host 端口，不进 vhost
      - "8806:8100"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8100/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expense-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      agent:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-expense}
      DATABASE_USER: ${POSTGRES_USER:-expense}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-expense}
      AGENT_BASE_URL: http://agent:8100
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: expense-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres-data:
